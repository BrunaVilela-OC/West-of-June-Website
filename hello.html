<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  componentDidMount() {
    setTimeout(() => {
      const sun = document.querySelector('[data-sun]');
      const glow = document.querySelector('[data-glow]');
      if (sun) sun.style.transform = 'translateY(0)';
      if (glow) glow.style.opacity = '1';
      const els = document.querySelectorAll('[data-reveal]');
      els.forEach((el, i) => {
        el.style.transition = (el.style.transition ? el.style.transition + ',' : '') + 'opacity .8s cubic-bezier(.2,.75,.2,1), transform .8s cubic-bezier(.2,.75,.2,1)';
        setTimeout(() => { el.style.opacity = '1'; el.style.transform = 'translateY(0)'; }, 350 + i * 90);
      });
    }, 60);
  }
  renderVals() { return {}; }
}
</script>
